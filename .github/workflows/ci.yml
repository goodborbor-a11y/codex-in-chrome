name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: MCP smoke test
        shell: bash
        run: |
          pnpm bridge > bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:17345/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:17345/health > /dev/null
          pnpm test:mcp

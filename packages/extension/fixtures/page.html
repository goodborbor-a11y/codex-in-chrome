<!doctype html><html><head><title>Codex fixture</title><style>body{font:16px system-ui;min-height:2000px}button,input,textarea{margin:12px;padding:8px}#overlay-target{position:fixed;top:16px;right:105px;width:100px;height:36px;margin:0;padding:0;z-index:2}#stop-target{position:fixed;top:16px;right:16px;width:54px;height:36px;margin:0;padding:0;z-index:2}</style></head><body><h1>Fixture page</h1><button id="overlay-target" aria-label="Button under status pill" onclick="document.querySelector('#overlay-result').textContent='Overlay target clicked'">Click me</button><button id="stop-target" aria-label="Button under Stop" onclick="document.querySelector('#stop-result').textContent='Stop target clicked'">Under Stop</button><p id="overlay-result"></p><p id="stop-result"></p><input id="name" aria-label="Name"><button id="submit" onclick="document.querySelector('#result').textContent='Hello '+document.querySelector('#name').value">Submit</button><p id="result"></p><input id="upload" type="file" aria-label="Upload"><textarea id="paste" aria-label="Paste here"></textarea><div style="margin-top:1200px">Bottom marker</div></body></html>

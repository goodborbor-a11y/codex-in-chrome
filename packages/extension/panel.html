<!doctype html><html><head><meta charset="utf-8"><title>Codex in Chrome</title><style>
body{font:14px system-ui;margin:0;color:#f6f3ff;background:radial-gradient(circle at 0 0,#00f7f61c,transparent 38%),radial-gradient(circle at 100% 100%,#f708f71c,transparent 42%),#12111d}header{padding:16px;background:linear-gradient(110deg,#132b32,#28152e);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#00f7f6,#f708f7) 1;box-shadow:0 3px 18px #00f7f633,0 3px 22px #f708f733;color:#fff;font-weight:700;font-size:18px}main{padding:16px}button,input{font:inherit}button{border:1px solid #00f7f680;border-radius:8px;background:linear-gradient(110deg,#00f7f6,#f708f7);color:#171023;font-weight:700;padding:9px 12px;cursor:pointer;margin:4px 4px 4px 0;box-shadow:0 0 10px #00f7f644,0 0 12px #f708f744;transition:filter 150ms,box-shadow 150ms}button:hover{filter:brightness(1.12);box-shadow:0 0 16px #00f7f688,0 0 18px #f708f766}button.danger{background:#301b36;color:#fff;border-color:#f708f7;box-shadow:0 0 12px #f708f755}button.soft{background:#19343a;color:#dfffff;border-color:#00f7f6;box-shadow:0 0 12px #00f7f655}input{padding:8px;border:1px solid #735f86;border-radius:6px;width:90%;background:#191725;color:#f6f3ff}input:focus{outline:1px solid #00f7f6;box-shadow:0 0 8px #00f7f677,0 0 12px #f708f755}section{background:#1b1928;border:1px solid #524260;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 14px #00f7f61a,0 2px 18px #f708f71a}#code{font:700 30px monospace;letter-spacing:5px;color:#00f7f6;text-shadow:0 0 12px #00f7f6aa,0 0 18px #f708f777}small{display:block;color:#c8bfd6;margin-top:8px}#log{max-height:250px;overflow:auto;font-size:12px;white-space:pre-wrap}label{display:block;margin:8px 0}
</style></head><body><header>Codex in Chrome</header><main><section><div id="state">Connecting…</div><div id="code"></div><small id="device"></small><div id="selectPrompt" hidden><p>A terminal session is asking which browser to use.</p><button id="selectThis">Use this browser</button></div></section><section><b>Site permission</b><label><input id="allowAll" type="checkbox" style="width:auto"> Allow all websites</label><div id="site"></div><button id="once">Allow once</button><button id="always">Always allow</button><input id="allowUrl" placeholder="https://example.com"><button id="allowEntered">Allow entered site</button><label><input id="credential" type="checkbox" style="width:auto"> Allow credential entry on this site</label></section><section><button id="pause" class="soft">Pause</button><button id="stop" class="danger">Stop and detach</button></section><section><b>Activity</b><div id="log"></div></section></main><script src="panel.js"></script></body></html>
